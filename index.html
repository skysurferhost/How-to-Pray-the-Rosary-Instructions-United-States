<script>
  const url = './How-to-Pray-the-Rosary-Instructions.pdf';

  let pdfDoc = null;
  let pageNum = 1;
  let totalPages = 0;

  let scale = 0.85; // ⬅️ default zoomed OUT
  let posX = 0;
  let posY = 0;

  const viewer = document.getElementById('viewer');
  const container = document.getElementById('viewer-container');
  const indicator = document.getElementById('pageIndicator');

  pdfjsLib.getDocument(url).promise.then(pdf => {
    pdfDoc = pdf;
    totalPages = pdf.numPages;
    renderPage();
  });

  function renderPage() {
    viewer.innerHTML = '';
    pdfDoc.getPage(pageNum).then(page => {
      const viewport = page.getViewport({ scale: 1 });
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      canvas.width = viewport.width;
      canvas.height = viewport.height;

      page.render({ canvasContext: ctx, viewport });
      viewer.appendChild(canvas);

      indicator.textContent = `Page ${pageNum} / ${totalPages}`;
      resetTransform();
    });
  }

  function resetTransform() {
    posX = (container.clientWidth - viewer.clientWidth * scale) / 2;
    posY = 20;
    applyTransform();
  }

  function applyTransform() {
    viewer.style.transform =
      `translate(${posX}px, ${posY}px) scale(${scale})`;
  }

  function zoomAtPoint(delta, cx, cy) {
    const prevScale = scale;
    scale = Math.min(Math.max(0.5, scale + delta), 4);

    const dx = cx - posX;
    const dy = cy - posY;

    posX -= dx * (scale / prevScale - 1);
    posY -= dy * (scale / prevScale - 1);

    applyTransform();
  }

  /* Buttons */
  function zoomIn() {
    zoomAtPoint(0.2, container.clientWidth / 2, container.clientHeight / 2);
  }

  function zoomOut() {
    zoomAtPoint(-0.2, container.clientWidth / 2, container.clientHeight / 2);
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  }

  function nextPage() {
    if (pageNum < totalPages) {
      pageNum++;
      renderPage();
    }
  }

  function prevPage() {
    if (pageNum > 1) {
      pageNum--;
      renderPage();
    }
  }

  /* ------------------------
     DRAG / PAN (ALL DEVICES)
  ------------------------- */
  let dragging = false;
  let startX, startY;

  container.addEventListener('pointerdown', e => {
    dragging = true;
    startX = e.clientX - posX;
    startY = e.clientY - posY;
  });

  window.addEventListener('pointermove', e => {
    if (!dragging) return;
    posX = e.clientX - startX;
    posY = e.clientY - startY;
    applyTransform();
  });

  window.addEventListener('pointerup', () => dragging = false);

  /* ------------------------
     DESKTOP WHEEL ZOOM
  ------------------------- */
  container.addEventListener('wheel', e => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.15 : -0.15;
    zoomAtPoint(delta, e.offsetX, e.offsetY);
  }, { passive: false });

  /* ------------------------
     MOBILE PINCH ZOOM (FIX)
  ------------------------- */
  let lastDistance = null;

  container.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      lastDistance = getDistance(e.touches[0], e.touches[1]);
    }
  }, { passive: false });

  container.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && lastDistance !== null) {
      e.preventDefault();

      const currentDistance = getDistance(e.touches[0], e.touches[1]);
      const delta = (currentDistance - lastDistance) * 0.002;

      const centerX =
        (e.touches[0].clientX + e.touches[1].clientX) / 2 -
        container.getBoundingClientRect().left;

      const centerY =
        (e.touches[0].clientY + e.touches[1].clientY) / 2 -
        container.getBoundingClientRect().top;

      zoomAtPoint(delta, centerX, centerY);
      lastDistance = currentDistance;
    }
  }, { passive: false });

  container.addEventListener('touchend', () => {
    lastDistance = null;
  });

  function getDistance(t1, t2) {
    return Math.hypot(
      t2.clientX - t1.clientX,
      t2.clientY - t1.clientY
    );
  }

  /* ------------------------
     DOUBLE TAP ZOOM
  ------------------------- */
  let lastTap = 0;
  container.addEventListener('click', () => {
    const now = Date.now();
    if (now - lastTap < 300) {
      zoomAtPoint(
        scale > 1.2 ? -scale + 0.85 : 0.8,
        container.clientWidth / 2,
        container.clientHeight / 2
      );
    }
    lastTap = now;
  });
</script>
