<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rosary PDF Viewer United States</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #111;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }

  /* ===== TOOLBAR ===== */
  .toolbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 44px;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    z-index: 1000;
  }

  .toolbar button {
    background: #fff;
    border: none;
    padding: 6px 12px;
    font-size: 14px;
    border-radius: 4px;
    cursor: pointer;
  }

  /* ===== VIEWER ===== */
  #viewer-container {
    position: absolute;
    top: 44px;
    bottom: 44px;
    left: 0;
    right: 0;
    overflow: hidden;
    touch-action: none;
  }

  #viewer {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
    cursor: grab;

    /* 🚀 PERFORMANCE BOOST */
    will-change: transform;
    transform: translateZ(0);
  }

  #viewer.dragging {
    cursor: grabbing;
  }

  canvas {
    display: block;
    margin: 0 auto;
  }

  /* ===== PAGE NAV ===== */
  .page-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 44px;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 1000;
    color: #fff;
    font-size: 14px;
  }

  .page-nav button {
    background: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
  }

  @media (max-width: 768px) {
    .toolbar, .page-nav {
      height: 50px;
    }
    #viewer-container {
      top: 50px;
      bottom: 50px;
    }
  }
</style>
</head>

<body>

<div class="toolbar">
  <button onclick="zoomOut()">−</button>
  <button onclick="zoomIn()">+</button>
  <button onclick="toggleFullscreen()">⤢ Fullscreen</button>
</div>

<div id="viewer-container">
  <div id="viewer"></div>
</div>

<div class="page-nav">
  <button onclick="prevPage()">◀</button>
  <span id="pageIndicator">Page 1</span>
  <button onclick="nextPage()">▶</button>
</div>

<script>
  const url = './How-to-Pray-the-Rosary-Instructions.pdf';

  let pdfDoc = null;
  let pageNum = 1;
  let totalPages = 0;

  /* 🔍 Default zoom */
  let scale = window.innerWidth < 768 ? 0.25 : 0.4;
  let targetScale = scale;
  let targetX = 0;
  let targetY = 0;
  let rafPending = false;

  const viewer = document.getElementById('viewer');
  const container = document.getElementById('viewer-container');
  const indicator = document.getElementById('pageIndicator');

  pdfjsLib.getDocument(url).promise.then(pdf => {
    pdfDoc = pdf;
    totalPages = pdf.numPages;
    renderPage();
  });

  function renderPage() {
    viewer.innerHTML = '';
    pdfDoc.getPage(pageNum).then(page => {

      /* 📉 Smaller base render for performance */
      const baseScale = window.innerWidth < 768 ? 0.8 : 1;
      const viewport = page.getViewport({ scale: baseScale });

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      canvas.width = viewport.width;
      canvas.height = viewport.height;

      page.render({ canvasContext: ctx, viewport });
      viewer.appendChild(canvas);

      indicator.textContent = `Page ${pageNum} / ${totalPages}`;
      resetTransform();
    });
  }

  function resetTransform() {
    targetScale = scale;
    targetX = (container.clientWidth - viewer.clientWidth * scale) / 2;
    targetY = 20;
    applyTransform();
  }

  function applyTransform() {
    if (rafPending) return;
    rafPending = true;

    requestAnimationFrame(() => {
      viewer.style.transform =
        `translate(${targetX}px, ${targetY}px) scale(${targetScale})`;
      rafPending = false;
    });
  }

  function zoomAtPoint(delta, cx, cy) {
    const prevScale = targetScale;
    targetScale = Math.min(Math.max(0.25, targetScale + delta), 4);

    const dx = cx - targetX;
    const dy = cy - targetY;

    targetX -= dx * (targetScale / prevScale - 1);
    targetY -= dy * (targetScale / prevScale - 1);

    scale = targetScale;
    applyTransform();
  }

  function zoomIn() {
    zoomAtPoint(0.2, container.clientWidth / 2, container.clientHeight / 2);
  }

  function zoomOut() {
    zoomAtPoint(-0.2, container.clientWidth / 2, container.clientHeight / 2);
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  }

  function nextPage() {
    if (pageNum < totalPages) {
      pageNum++;
      renderPage();
    }
  }

  function prevPage() {
    if (pageNum > 1) {
      pageNum--;
      renderPage();
    }
  }

  /* 🖐 PAN (THROTTLED) */
  let dragging = false;
  let startX, startY;
  let lastMove = 0;

  container.addEventListener('pointerdown', e => {
    dragging = true;
    viewer.classList.add('dragging');
    startX = e.clientX - targetX;
    startY = e.clientY - targetY;
  });

  window.addEventListener('pointermove', e => {
    if (!dragging) return;
    const now = performance.now();
    if (now - lastMove < 16) return;
    lastMove = now;

    targetX = e.clientX - startX;
    targetY = e.clientY - startY;
    applyTransform();
  });

  window.addEventListener('pointerup', () => {
    dragging = false;
    viewer.classList.remove('dragging');
  });

  container.addEventListener('wheel', e => {
    e.preventDefault();
    zoomAtPoint(e.deltaY < 0 ? 0.15 : -0.15, e.offsetX, e.offsetY);
  }, { passive: false });
</script>

</body>
</html>
