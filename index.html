<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>How to Pray the Rosary</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #111;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }

  /* Toolbar */
  .toolbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 44px;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 1000;
  }

  .toolbar button {
    background: #fff;
    border: none;
    padding: 6px 12px;
    font-size: 14px;
    border-radius: 4px;
    cursor: pointer;
  }

  #viewer-container {
    position: absolute;
    top: 44px;
    bottom: 0;
    left: 0;
    right: 0;
    overflow: hidden;
    touch-action: none; /* required for pinch */
  }

  #viewer {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
    cursor: grab;
  }

  #viewer.dragging {
    cursor: grabbing;
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    margin-bottom: 12px;
  }

  @media (max-width: 768px) {
    .toolbar {
      height: 50px;
    }
    .toolbar button {
      font-size: 16px;
      padding: 8px 14px;
    }
    #viewer-container {
      top: 50px;
    }
  }
</style>
</head>

<body>

<div class="toolbar">
  <button onclick="zoomOut()">−</button>
  <button onclick="zoomIn()">+</button>
  <button onclick="toggleFullscreen()">⤢ Fullscreen</button>
</div>

<div id="viewer-container">
  <div id="viewer"></div>
</div>

<script>
  const url = './How-to-Pray-the-Rosary-Instructions.pdf';

  let pdfDoc = null;
  let scale = 1;
  let posX = 0;
  let posY = 0;

  const viewer = document.getElementById('viewer');
  const container = document.getElementById('viewer-container');

  pdfjsLib.getDocument(url).promise.then(pdf => {
    pdfDoc = pdf;
    renderPDF();
  });

  function renderPDF() {
    viewer.innerHTML = '';
    for (let i = 1; i <= pdfDoc.numPages; i++) {
      pdfDoc.getPage(i).then(page => {
        const viewport = page.getViewport({ scale: 1 });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        page.render({ canvasContext: canvas.getContext('2d'), viewport });
        viewer.appendChild(canvas);
      });
    }
    resetTransform();
  }

  function applyTransform() {
    viewer.style.transform =
      `translate(${posX}px, ${posY}px) scale(${scale})`;
  }

  function resetTransform() {
    posX = 0;
    posY = 0;
    applyTransform();
  }

  function zoomIn() {
    scale += 0.15;
    applyTransform();
  }

  function zoomOut() {
    scale = Math.max(0.6, scale - 0.15);
    applyTransform();
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  }

  /* 🖱️ Drag / Pan */
  let dragging = false;
  let startX, startY;

  container.addEventListener('pointerdown', e => {
    dragging = true;
    viewer.classList.add('dragging');
    startX = e.clientX - posX;
    startY = e.clientY - posY;
  });

  window.addEventListener('pointermove', e => {
    if (!dragging) return;
    posX = e.clientX - startX;
    posY = e.clientY - startY;
    applyTransform();
  });

  window.addEventListener('pointerup', () => {
    dragging = false;
    viewer.classList.remove('dragging');
  });

  /* 🖱️ Scroll to zoom (desktop) */
  container.addEventListener('wheel', e => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.1 : 0.1;
    scale = Math.min(Math.max(0.6, scale + delta), 4);
    applyTransform();
  }, { passive: false });

  /* 📱 Pinch to zoom (mobile) */
  let lastDistance = null;

  container.addEventListener('touchmove', e => {
    if (e.touches.length === 2) {
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (lastDistance) {
        const delta = (distance - lastDistance) * 0.002;
        scale = Math.min(Math.max(0.6, scale + delta), 4);
        applyTransform();
      }
      lastDistance = distance;
    }
  }, { passive: false });

  container.addEventListener('touchend', () => {
    lastDistance = null;
  });

  /* 🔁 Double-click / Double-tap zoom */
  let lastTap = 0;

  container.addEventListener('click', e => {
    const now = Date.now();
    if (now - lastTap < 300) {
      scale = scale > 1.2 ? 1 : 2;
      resetTransform();
    }
    lastTap = now;
  });
</script>

</body>
</html>
