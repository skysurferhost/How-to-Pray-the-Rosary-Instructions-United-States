<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>How to Pray the Rosary</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
  body {
    margin: 0;
    background: #111;
    font-family: Arial, sans-serif;
  }

  #viewer {
    width: 100%;
    height: 100vh;
    overflow: auto;
    text-align: center;
  }

  canvas {
    width: 100% !important;
    height: auto !important;
    margin-bottom: 16px;
  }

  .toolbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: rgba(0,0,0,0.85);
    padding: 8px;
    display: flex;
    justify-content: center;
    gap: 10px;
    z-index: 10;
  }

  .toolbar button {
    background: #fff;
    border: none;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 14px;
    border-radius: 4px;
  }

  @media (max-width: 768px) {
    .toolbar button {
      font-size: 16px;
      padding: 8px 14px;
    }
  }
</style>
</head>

<body>

<div class="toolbar">
  <button onclick="zoomOut()">−</button>
  <button onclick="zoomIn()">+</button>
</div>

<div id="viewer"></div>

<script>
  const url = './How-to-Pray-the-Rosary-Instructions.pdf';

  let pdfDoc = null;
  let scale = 1.2;

  pdfjsLib.getDocument(url).promise.then(pdf => {
    pdfDoc = pdf;
    renderAllPages();
  });

  function renderAllPages() {
    const viewer = document.getElementById('viewer');
    viewer.innerHTML = '';

    for (let i = 1; i <= pdfDoc.numPages; i++) {
      pdfDoc.getPage(i).then(page => {
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        canvas.height = viewport.height;
        canvas.width = viewport.width;

        page.render({ canvasContext: ctx, viewport });
        viewer.appendChild(canvas);
      });
    }
  }

  function zoomIn() {
    scale += 0.15;
    renderAllPages();
  }

  function zoomOut() {
    scale = Math.max(0.6, scale - 0.15);
    renderAllPages();
  }

function next() { if (pageNum < pdf.numPages) { pageNum++; render(); } }
function prev() { if (pageNum > 1) { pageNum--; render(); } }
</script>

</body>
</html>
