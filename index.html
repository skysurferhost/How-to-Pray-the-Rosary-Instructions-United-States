<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>How to Pray the Rosary</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #111;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }

  /* Toolbar */
  .toolbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 44px;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 1000;
  }

  .toolbar button {
    background: #fff;
    border: none;
    padding: 6px 12px;
    font-size: 14px;
    border-radius: 4px;
    cursor: pointer;
  }

  /* Viewer container */
  #viewer-container {
    position: absolute;
    top: 44px;
    bottom: 0;
    left: 0;
    right: 0;
    overflow: hidden; /* ⬅️ prevents bottom gap */
    touch-action: none;
  }

  /* Viewer */
  #viewer {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: top left;
    cursor: grab;
  }

  #viewer.dragging {
    cursor: grabbing;
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    margin-bottom: 12px;
  }

  /* Mobile tweaks */
  @media (max-width: 768px) {
    .toolbar {
      height: 50px;
    }

    .toolbar button {
      font-size: 16px;
      padding: 8px 14px;
    }

    #viewer-container {
      top: 50px;
    }
  }
</style>
</head>

<body>

<div class="toolbar">
  <button onclick="zoomOut()">−</button>
